<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="rainSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#075985" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="400" fill="url(#rainSky)"/>
  <polygon points="0,200 600,200 600,400 0,400" fill="#1e293b"/>

  <!-- Submerged Curb & Sidewalk -->
  <polygon points="40,240 560,240 580,380 20,380" fill="#475569"/>
  <line x1="40" y1="240" x2="560" y2="240" stroke="#94a3b8" stroke-width="4"/>

  <!-- Waterlogging pooling area -->
  <ellipse cx="300" cy="310" rx="260" ry="70" fill="url(#waterGrad)"/>
  <ellipse cx="300" cy="310" rx="200" ry="45" fill="#38bdf8" opacity="0.3"/>
  <ellipse cx="300" cy="310" rx="130" ry="25" fill="#e0f2fe" opacity="0.4"/>

  <!-- Water ripples -->
  <ellipse cx="220" cy="300" rx="50" ry="12" fill="none" stroke="#bae6fd" stroke-width="2"/>
  <ellipse cx="380" cy="325" rx="60" ry="14" fill="none" stroke="#bae6fd" stroke-width="2"/>

  <!-- Status badges -->
  <rect x="20" y="20" width="240" height="34" rx="6" fill="#000000" opacity="0.75"/>
  <text x="32" y="42" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">[!] WATERLOGGED WALKWAY</text>
  <rect x="360" y="20" width="220" height="34" rx="6" fill="#000000" opacity="0.75"/>
  <text x="372" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">DILSUKHNAGAR ENTRY</text>
</svg>
