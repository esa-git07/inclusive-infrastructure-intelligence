<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="drainSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="pavementGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#drainSky)"/>
  <polygon points="50,150 550,150 600,400 0,400" fill="url(#pavementGrad)"/>

  <!-- Void open pit -->
  <ellipse cx="300" cy="270" rx="140" ry="60" fill="#09090b"/>
  <ellipse cx="300" cy="280" rx="120" ry="40" fill="#020617"/>
  
  <!-- Danger warning perimeter striping -->
  <line x1="160" y1="265" x2="220" y2="310" stroke="#ef4444" stroke-width="6" stroke-dasharray="8,6"/>
  <line x1="440" y1="265" x2="380" y2="310" stroke="#ef4444" stroke-width="6" stroke-dasharray="8,6"/>
  <line x1="220" y1="330" x2="380" y2="330" stroke="#ef4444" stroke-width="6" stroke-dasharray="8,6"/>

  <!-- Status badges -->
  <rect x="20" y="20" width="240" height="34" rx="6" fill="#000000" opacity="0.75"/>
  <text x="32" y="42" fill="#ef4444" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">[!] UNGUARDED OPEN DRAIN</text>
  <rect x="360" y="20" width="220" height="34" rx="6" fill="#000000" opacity="0.75"/>
  <text x="372" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">KOTI MEDICAL GATE</text>
</svg>
