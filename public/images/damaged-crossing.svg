<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="crossSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#crossSky)"/>
  <polygon points="0,180 600,180 600,400 0,400" fill="#334155"/>

  <!-- Zebra crossing stripes with eroded / broken sections -->
  <polygon points="60,200 140,200 120,380 30,380" fill="#f8fafc" opacity="0.9"/>
  <polygon points="180,200 260,200 240,380 150,380" fill="#f8fafc" opacity="0.85"/>
  <polygon points="300,200 380,200 360,380 270,380" fill="#cbd5e1" opacity="0.5"/>
  <polygon points="420,200 500,200 480,380 390,380" fill="#f8fafc" opacity="0.9"/>

  <!-- Broken curb lip at transition -->
  <polygon points="0,380 600,380 600,400 0,400" fill="#1e293b"/>
  <path d="M220,380 L260,360 L320,390 L380,365 L430,380" stroke="#ef4444" stroke-width="6" fill="none"/>
  <circle cx="260" cy="360" r="7" fill="#ef4444"/>
  <circle cx="380" cy="365" r="7" fill="#ef4444"/>

  <!-- Status badges -->
  <rect x="20" y="20" width="240" height="34" rx="6" fill="#000000" opacity="0.75"/>
  <text x="32" y="42" fill="#ef4444" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">[!] DAMAGED TACTILE CROSSING</text>
  <rect x="360" y="20" width="220" height="34" rx="6" fill="#000000" opacity="0.75"/>
  <text x="372" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">SECUNDERABAD JN</text>
</svg>
