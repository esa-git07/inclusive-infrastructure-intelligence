<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="skyGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="wallGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="rampGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <!-- Background building & sky -->
  <rect width="600" height="400" fill="url(#skyGrad1)"/>
  <rect y="80" width="600" height="200" fill="url(#wallGrad1)"/>
  <rect x="80" y="110" width="100" height="120" fill="#334155" rx="4"/>
  <rect x="220" y="110" width="100" height="120" fill="#334155" rx="4"/>
  <rect x="360" y="110" width="100" height="120" fill="#334155" rx="4"/>

  <!-- Pavement surface -->
  <polygon points="0,280 600,280 600,400 0,400" fill="#475569"/>

  <!-- Ramp structure with yellow warning curb -->
  <polygon points="120,280 480,280 540,380 60,380" fill="url(#rampGrad1)"/>
  <line x1="60" y1="380" x2="120" y2="280" stroke="#eab308" stroke-width="8"/>
  <line x1="540" y1="380" x2="480" y2="280" stroke="#eab308" stroke-width="8"/>

  <!-- Wheelchair handrail -->
  <line x1="110" y1="230" x2="50" y2="330" stroke="#0284c7" stroke-width="6"/>
  <line x1="110" y1="280" x2="110" y2="230" stroke="#0284c7" stroke-width="5"/>
  <line x1="80" y1="330" x2="80" y2="280" stroke="#0284c7" stroke-width="5"/>
  <line x1="50" y1="380" x2="50" y2="330" stroke="#0284c7" stroke-width="5"/>

  <!-- OBSTRUCTION: Piled garbage bags, wooden pallet, debris blocking the ramp -->
  <ellipse cx="280" cy="330" rx="90" ry="35" fill="#1e293b" opacity="0.85"/>
  <path d="M220,340 Q250,290 280,330 Q320,280 360,340 Z" fill="#0f172a"/>
  <path d="M250,330 Q280,270 310,320 Z" fill="#334155"/>
  <polygon points="210,335 270,305 285,320 225,350" fill="#78350f"/>
  <polygon points="260,340 330,310 345,325 275,355" fill="#92400e"/>
  <circle cx="320" cy="330" r="18" fill="#dc2626" opacity="0.9"/>
  <rect x="230" y="325" width="40" height="20" fill="#e2e8f0" transform="rotate(-15 230 325)"/>

  <!-- Status badges -->
  <rect x="20" y="20" width="220" height="34" rx="6" fill="#000000" opacity="0.75"/>
  <text x="32" y="42" fill="#ef4444" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">[!] BARRIER: BLOCKED RAMP</text>
  <rect x="360" y="20" width="220" height="34" rx="6" fill="#000000" opacity="0.75"/>
  <text x="372" y="42" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">HYD-CIVIC-CAM 0842</text>
</svg>
